<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- Tints the iOS Safari / Chrome browser chrome to match the page,
         so the bars above and below never render as white bands. -->
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">

    <!-- A single shell serves every route, so this title is only the
         starting value. Each page sets its own via useDocumentTitle. -->
    <title>j0ey-code</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- React mounts here. The background layers are painted by
         html::before / body::before / body::after in site.css, all of them
         position:fixed with a negative z-index, so this wrapper sits above
         them exactly the way the old page content did. -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
